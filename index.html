<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>كابتن مينا عياد - توصيل سريع بالموتوسيكل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-950: #060d1f;
      --navy-900: #0b1736;
      --navy-800: #11224d;
      --navy-700: #183068;
      --gold-400: #f6c453;
      --gold-500: #e5a928;
      --gold-100: #fff5d6;
      --teal-400: #2dd4bf;
      --teal-500: #14b8a6;
      --green-500: #22c55e;
      --red-500: #ef4444;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(6, 13, 31, 0.06);
      --shadow-md: 0 8px 24px rgba(6, 13, 31, 0.12);
      --shadow-lg: 0 16px 36px rgba(6, 13, 31, 0.22);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(160deg, var(--navy-950) 0%, var(--navy-800) 55%, #0c2942 100%);
      min-height: 100vh;
      color: var(--slate-800);
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--slate-50);
      position: relative;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .top-header {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 75%, var(--navy-700) 100%);
      color: var(--white);
      padding: 20px 18px 24px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      position: relative;
      box-shadow: var(--shadow-md);
    }

    .top-header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 12%;
      right: 12%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-400), transparent);
      border-radius: 999px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .moto-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--gold-400), var(--gold-500));
      color: var(--navy-950);
      display: grid;
      place-items: center;
      font-size: 28px;
      box-shadow: 0 6px 18px rgba(246, 196, 83, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.25;
      color: var(--white);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--gold-100);
      opacity: 0.9;
      margin-top: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
      white-space: nowrap;
    }

    .status-pill.busy {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-500);
    }

    .status-pill.busy .status-dot {
      background: var(--red-500);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 16px 0;
      background: var(--slate-200);
      padding: 5px;
      border-radius: 14px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--slate-600);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .mode-tab.active {
      background: var(--navy-900);
      color: var(--gold-400);
      box-shadow: var(--shadow-sm);
    }

    .content-area {
      padding: 14px 16px 28px;
      flex: 1;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-200);
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy-900);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .service-btn {
      border: 1.5px solid var(--slate-200);
      background: var(--slate-50);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      text-align: right;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: 'Cairo', sans-serif;
    }

    .service-btn.selected {
      border-color: var(--navy-800);
      background: var(--gold-100);
      box-shadow: 0 4px 12px rgba(229, 169, 40, 0.2);
    }

    .service-emoji {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    .service-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--navy-950);
      display: block;
    }

    .service-desc {
      font-size: 11px;
      color: var(--slate-600);
      display: block;
      margin-top: 2px;
